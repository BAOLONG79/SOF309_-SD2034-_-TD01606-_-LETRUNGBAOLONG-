name: CI Automation Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot App
        run: |
          mvn spring-boot:run &
          echo "Waiting for Spring Boot to start..."
          # Vòng lặp chờ tối đa 30 giây cho đến khi cổng 8080 mở
          for i in {1..30}; do
            if curl -s http://localhost:8080/CINEGO_ASM2_letrungbaolong/CINEGO/dang-nhap.html > /dev/null; then
              echo "Server started successfully!"
              exit 0
            fi
            sleep 1
          done
          echo "Server timed out!"
          exit 1

      - name: Run Tests
        run: mvn clean test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/