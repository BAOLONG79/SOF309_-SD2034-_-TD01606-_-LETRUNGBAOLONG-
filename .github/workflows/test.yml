name: CI Automation Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Spring Boot App
        run: mvn spring-boot:run &
        # Lệnh & giúp ứng dụng chạy ngầm để GitHub Actions tiếp tục chuyển sang bước chạy test

      - name: Wait for Server to Start
        run: sleep 10
        # Dừng 10 giây để đảm bảo server đã khởi động xong cổng 8080

      - name: Run Tests
        run: mvn clean test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/