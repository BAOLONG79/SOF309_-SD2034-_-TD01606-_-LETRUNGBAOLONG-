<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CINEGO - Danh mục phim</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">

            <a href="index.html" class="logo">
                CINE<span>GO</span>
            </a>

            <nav class="menu">
                <a href="index.html">Trang chủ</a>
                <a href="danh-muc.html">Phim</a>
                <a href="tim-kiem.html">Tìm kiếm</a>
                <a href="yeu-thich.html">Yêu thích</a>
                <a href="lich-su.html">Lịch sử</a>
                <a href="lien-he.html">Liên hệ</a>
            </nav>

            <div class="header-actions">
                <a href="dang-nhap.html" class="btn-login">
                    Đăng nhập
                </a>

                <a href="dang-ky.html" class="btn-register">
                    Đăng ký
                </a>
            </div>

        </div>
    </header>


    <!-- TITLE -->
    <section class="section">

        <div class="container">

            <div class="section-title">
                <div>
                    <p>DANH MỤC</p>
                    <h2>Tất cả phim</h2>
                </div>
            </div>


            <!-- SEARCH + FILTER + SORT -->
            <div class="movie-filter">

                <div class="search-box">
                    <input
                        type="text"
                        id="movieSearch"
                        placeholder="Tìm tên phim..."
                    >

                    <button onclick="filterMovies()">
                        Tìm kiếm
                    </button>
                </div>


                <select id="categoryFilter" onchange="filterMovies()">

                    <option value="all">
                        Tất cả thể loại
                    </option>

                    <option value="Hành động">
                        Hành động
                    </option>

                    <option value="Siêu anh hùng">
                        Siêu anh hùng
                    </option>

                    <option value="Hoạt hình">
                        Hoạt hình
                    </option>

                    <option value="Khoa học viễn tưởng">
                        Khoa học viễn tưởng
                    </option>

                </select>


                <select id="sortPrice" onchange="filterMovies()">

                    <option value="default">
                        Sắp xếp
                    </option>

                    <option value="low">
                        Giá thấp → cao
                    </option>

                    <option value="high">
                        Giá cao → thấp
                    </option>

                    <option value="name">
                        Tên A → Z
                    </option>

                </select>

            </div>


            <!-- SỐ LƯỢNG KẾT QUẢ -->

            <p id="movieResult" class="movie-result"></p>


            <!-- DANH SÁCH PHIM -->

            <div
                id="movieList"
                class="movie-grid">
            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container footer-content">

            <div>
                <h2>CINEGO</h2>

                <p>
                    Website đặt vé xem phim trực tuyến.
                </p>
            </div>


            <div>

                <h3>Liên kết</h3>

                <a href="index.html">
                    Trang chủ
                </a>

                <a href="danh-muc.html">
                    Phim
                </a>

                <a href="lien-he.html">
                    Liên hệ
                </a>

            </div>


            <div>

                <h3>Thông tin</h3>

                <p>📞 0123 456 789</p>

                <p>
                    ✉ cinego@gmail.com
                </p>

            </div>

        </div>


        <div class="copyright">

            © 2026 CINEGO. All rights reserved.

        </div>

    </footer>


    <!-- BACK TO TOP -->

    <button
        id="backToTop"
        onclick="backToTop()">

        ↑

    </button>


    <!-- JAVASCRIPT -->

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
